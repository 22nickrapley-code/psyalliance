name = "psyalliance-agent-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Set these with `wrangler secret put <NAME>` before first deploy - never commit
# real values here:
#   SUPABASE_URL          e.g. https://vvmulsyvyjsxhcpqfpyo.supabase.co
#   SUPABASE_ANON_KEY      the "publishable"/anon key (safe for this - it can only
#                          reach what public_directory's grants already allow)
#   PAID_API_KEYS          comma-separated list of issued paid-tier keys (optional;
#                          absent = every request is treated as free tier)
#
# [vars] is for non-secret config only. Real values go in `wrangler secret put`,
# not here.
