    @media (max-width:560px) { .concept-bar { font-size:10px; padding:7px 10px } .public-nav .brand { font-size:21px } .public-nav .links { gap:6px } .public-nav .links .btn { padding:8px 11px; min-height:35px; font-size:11px } .public-hero h1 { font-size:48px } .public-hero { padding-top:52px } .public-section { padding:52px 20px } .public-footer { flex-direction:column; align-items:start } .page-head { display:block } .page-head .head-actions { justify-content:start; margin-top:19px } .page-head h1 { font-size:37px } .fields,.fields.three { grid-template-columns:1fr } .resource-grid,.tile-grid { grid-template-columns:1fr 1fr } .profile-hero { flex-wrap:wrap } .profile-hero .actions { width:100%; justify-content:flex-start } .mini-person { flex-wrap:wrap } .mini-person .avatar { flex:0 0 37px } .mini-person .content { flex-basis:calc(100% - 50px) } .progress-step { font-size:10px; padding-right:1px } .hero-proof { margin-top:34px } .workspace-top .top-actions .btn { display:none } }
    @media (max-width:390px) { .resource-grid,.tile-grid { grid-template-columns:1fr } .public-hero h1 { font-size:41px } .tab { padding-left:9px; padding-right:9px } }

<body>
  <div class="concept-bar"><b>DESIGN CONCEPT</b><span>Illustrative sample content · Local interactions only · No requests or messages are sent.</span><button type="button" id="concept-switch">View public page</button></div>
  <div id="root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <script>
    const clinicians = [
      {id:'maya',name:'Maya Chen, PsyD',initial:'MC',tone:'gold',role:'Clinical psychologist',city:'New York, NY',authority:'New York licence on file',focus:'Adults · Trauma & anxiety',service:'Psychotherapy',availability:'Referral spaces',fresh:'Confirmed 2 days ago',relation:'Trusted colleague',languages:'English, Mandarin',modality:'Virtual & in person',insurance:'Out of network',bio:'Adult psychotherapy with a focus on trauma, life transitions and complex anxiety.',fact:'Professional licence evidence reviewed; current service availability confirmed by the member.'},
      {id:'eli',name:'Eli Ramirez, MD',initial:'ER',tone:'blue',role:'Psychiatrist',city:'Brooklyn, NY',authority:'New York licence on file',focus:'Adults · Medication management',service:'Prescribing',availability:'Coverage capacity',fresh:'Confirmed 5 days ago',relation:'Worked with before',languages:'English, Spanish',modality:'Virtual',insurance:'Several plans',bio:'Psychiatric evaluation and collaborative medication management for adults.',fact:'Professional licence evidence reviewed; coverage availability reported by the member.'},
      {id:'imani',name:'Imani Brooks, PhD',initial:'IB',tone:'lilac',role:'Clinical psychologist',city:'New York, NY',authority:'New York licence on file',focus:'Adults · Perinatal mental health',service:'Psychotherapy',availability:'Referral spaces',fresh:'Confirmed yesterday',relation:'Suggested for you',languages:'English',modality:'Virtual & in person',insurance:'Several plans',bio:'Individual therapy for adults navigating perinatal transitions and relationships.',fact:'Professional licence evidence reviewed; referral availability reported by the member.'},
      {id:'noah',name:'Noah Patel, PsyD',initial:'NP',tone:'',role:'Clinical psychologist',city:'Jersey City, NJ',authority:'New Jersey licence on file',focus:'Adults · Anxiety & OCD',service:'Psychotherapy',availability:'Availability paused',fresh:'Updated 8 days ago',relation:'Saved clinician',languages:'English, Hindi',modality:'Virtual',insurance:'Out of network',bio:'Evidence-informed treatment for anxiety and obsessive-compulsive concerns.',fact:'Professional licence evidence reviewed; currently paused for new requests.'}
    ];
    const resources = [
      {id:'PA-01',title:'Reciprocal Coverage Agreement',purpose:'Set expectations with a trusted cover partner before a planned absence.',link:'requests',tag:'Coverage',version:'v1.2 · reviewed Aug 2026'},
      {id:'PA-02',title:'Extended Leave & Handoff Pack',purpose:'Plan continuity, responsibilities and return for a longer leave.',link:'requests',tag:'Coverage',version:'v1.1 · reviewed Aug 2026'},
      {id:'PA-04',title:'Peer Consultation Group Charter',purpose:'Agree group scope, confidentiality and participation rules.',link:'consult',tag:'Consult',version:'v1.2 · reviewed Aug 2026'},
      {id:'PA-05',title:'Case Consultation Template',purpose:'Shape a focused, de-identified question for colleagues.',link:'consult',tag:'Consult',version:'v1.1 · reviewed Aug 2026'},
      {id:'PA-07',title:'Referral & Transfer Toolkit',purpose:'Support a deliberate referral, acceptance and handoff.',link:'referrals',tag:'Referrals',version:'v1.0 · reviewed Aug 2026'},
      {id:'PA-08',title:'Shared-Care Collaboration',purpose:'Clarify roles when two clinicians coordinate care.',link:'messages',tag:'Collaboration',version:'v1.0 · reviewed Aug 2026'},
      {id:'PA-19',title:'Compliance & Renewal Tracker',purpose:'Keep key professional review dates in view.',link:'credentials',tag:'Practice',version:'v1.0 · reviewed Aug 2026'}
    ];
    const state = {page:'public',networkTab:'directory',networkQuery:'',networkService:'All services',networkJurisdiction:'All states',networkAvailability:false,selectedProfile:null,saved:['noah'],trusted:['maya'],excluded:[],blocked:[],consultTab:'discussions',consultDetail:null,consultAudience:'Trusted colleagues',consultRecipients:[],consultQuestion:'',consultContext:'',consultTag:'Clinical practice',consultReview:false,consultPosts:[{id:'c1',title:'How are you structuring a transition to a new covering clinician?',tag:'Coverage',audience:'Trusted colleagues',time:'Today · 9:42 AM',replies:3,author:'Maya Chen, PsyD',status:'Open',context:'A planned leave is approaching. I would welcome approaches to transition communication and clear role boundaries.'},{id:'c2',title:'What helps your peer consultation group stay clinically focused?',tag:'Group practice',audience:'Verified network',time:'Yesterday',replies:6,author:'Imani Brooks, PhD',status:'Open',context:'Seeking examples of agenda structures and facilitation.'},{id:'c3',title:'A useful framework for out-of-state collaboration',tag:'Professional practice',audience:'Trusted colleagues',time:'3 days ago',replies:4,author:'You',status:'Resolved',context:'Looking for a starting framework for exploring collaboration across different licensing jurisdictions.'}],consultReplies:{c1:['Clarify the scope of coverage in writing before you notify anyone.','I have found a joint handoff meeting useful where feasible.','We use a short shared checklist of responsibilities.'],c2:['A standing case presentation format helps us stay focused.'],c3:['A shared-care agreement gave us a clear place to document roles.']},coverageStep:0,coverageType:'Planned absence',coverageNeed:'Urgent contact only',coverageSelected:['maya'],referralStep:0,referralSelected:['imani'],messageThread:'maya',messages:{maya:[['Maya','I can review your coverage dates this week.'],['You','Thank you. I will send the non-identifying plan details for your review.']],eli:[['Eli','I have limited prescribing coverage in early October.']],group:[['Imani','I added two prompts for our next consultation group.']]},libraryTab:'curated',libraryQuery:'',availability:{referrals:'Open to selected referrals',coverage:'Limited capacity',consult:'Open to consult'},toastTimer:null,modal:null};
    const names = {home:'Home',requests:'Requests',referrals:'Referrals',network:'Network',consult:'Consult',messages:'Messages',library:'Practice Library',availability:'Availability',credentials:'Credentials',notifications:'Notifications',profile:'Your profile'};
    function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function avatar(c){return `<span class="avatar ${c.tone||''}" aria-hidden="true">${esc(c.initial)}</span>`;}
    function status(text,tone=''){return `<span class="status ${tone}">${esc(text)}</span>`;}
    function button(label,action,cls='secondary'){return `<button type="button" class="btn ${cls}" data-action="${action}">${label}</button>`;}
    function nav(page){state.page=page;state.selectedProfile=null;state.consultDetail=null;state.consultReview=false;state.modal=null;render();window.scrollTo({top:0,behavior:'smooth'});}
    function toast(message){clearTimeout(state.toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(message)}</div>`;state.toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',4200);}
    function header(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;}
    function memberShell(){let main=['home','requests','network','consult','messages'], secondary=['referrals','library','availability','credentials'];return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">ψ</span>psyalliance</div><div class="rail-label">Your practice</div><nav class="rail-nav" aria-label="Main navigation">${main.map(p=>railLink(p)).join('')}</nav><div class="rail-label">Tools & account</div><nav class="rail-nav" aria-label="Tools and account">${secondary.map(p=>railLink(p)).join('')}</nav><div class="rail-bottom">${railLink('profile')}<div class="rail-user"><span class="avatar">AR</span><span><b>Alex Rivers, PsyD</b>Founding member · NY</span></div></div></aside><div class="workspace"><header class="workspace-top"><div class="breadcrumbs"><button class="icon-button mobile-menu" data-action="mobile-menu" aria-label="Open menu">☰</button><span>Workspace</span><span>›</span><b>${esc(names[state.page])}</b></div><div class="top-actions"><span class="micro-note">Illustrative member account</span><button class="icon-button" data-page="notifications" aria-label="Notifications"><span aria-hidden="true">♧</span><span class="red-dot"></span></button><button class="btn secondary small-btn" data-page="public">Public site ↗</button></div></header><main class="page" id="main-content">${screens[state.page]()}</main></div></div><nav class="mobile-bottom" aria-label="Mobile navigation">${['home','requests','network','consult','messages'].map(p=>`<button data-page="${p}" class="${state.page===p?'active':''}"><span class="symbol">${icon(p)}</span>${names[p]}</button>`).join('')}</nav>`;}
    function icon(p){return {home:'⌂',requests:'◇',referrals:'↗',network:'◎',consult:'✳',messages:'▤',library:'▧',availability:'◷',credentials:'◇',profile:'◌'}[p]||'◌';}
    function railLink(p){return `<button class="rail-link ${state.page===p?'active':''}" data-page="${p}" ${state.page===p?'aria-current="page"':''}><span class="ico">${icon(p)}</span>${names[p]}${p==='messages'?'<span class="count">2</span>':''}</button>`;}
    function publicPage(){return `<nav class="public-nav" aria-label="Public navigation"><div class="brand"><span class="brand-mark">ψ</span>psyalliance</div><div class="links"><button class="text-link" data-action="public-how">How it works</button><button class="text-link" data-action="public-trust">Our approach</button><button class="btn small-btn" data-page="home">Explore member experience ↗</button></div></nav><main><section class="public-hero"><div><div class="eyebrow">A professional network for independent clinicians</div><h1>A stronger circle for <em>independent practice.</em></h1><p class="lead">Find trusted cover, exchange referrals and consult with colleagues in a purposeful professional workspace.</p><div class="hero-actions">${button('Explore member experience ↗','demo','')} ${button('See how it works ↓','public-how','secondary')}</div><div class="hero-proof"><span class="seal">ψ</span><span><b>Built around professional judgment</b>Facts about credentials, relationships and availability are shown with their source and freshness.</span></div></div><div class="hero-visual" aria-label="Illustrative coverage plan preview"><div class="visual-top"><span>01 / A plan in progress</span><span>Illustrative view</span></div><div class="visual-card"><div class="eyebrow">Coverage plan</div><h3>Time away, thoughtfully covered.</h3><p>October 12–19 · New York · Two non-identifying needs</p><div class="divider" style="margin:17px 0 10px"></div><div class="line"><span class="round-number">1</span><span><b>Define the need</b><br>Urgent contact and prescribing coordination</span></div><div class="line"><span class="round-number">2</span><span><b>Review colleagues</b><br>Licence facts, capacity and relationship in context</span></div><div class="line"><span class="round-number">3</span><span><b>Confirm the plan</b><br>Track every open need through acceptance</span></div></div><div class="visual-card row between"><div><b style="font-size:13px">One need confirmed</b><div class="micro-note">One still awaiting a suitable colleague</div></div>${status('In progress','warn')}</div></div></section><section class="public-section tint" id="how-it-works"><div class="section-inner"><div class="section-intro"><div class="eyebrow">What the product helps you do</div><h2>Practice is better with a circle.</h2><p>Every feature is built around a concrete professional decision, with a clear next step.</p></div><div class="three-grid"><article class="editorial-card"><div class="n">01 /</div><h3>Keep care connected</h3><p>Plan coverage with explicit needs, reviewed candidates, deliberate invitations and a record of what remains unresolved.</p></article><article class="editorial-card"><div class="n">02 /</div><h3>Make considered referrals</h3><p>Find colleagues with relevant facts on file, follow interest and response, and coordinate a handoff outside the clinical record.</p></article><article class="editorial-card"><div class="n">03 /</div><h3>Think with colleagues</h3><p>Ask focused, de-identified questions of the right audience and continue the conversation in a private group or thread.</p></article></div></div></section><section class="public-section" id="our-approach"><div class="section-inner public-quote"><div><div class="eyebrow">Our approach</div><p class="quote">“Independent does not have to mean practising alone.”</p></div><div class="quote-note">PsyAlliance is designed around clinician choice. Profiles distinguish professional evidence on file from member-reported availability. Suitability for a particular patient or jurisdiction remains a professional decision.</div></div></section><section class="public-section tint"><div class="section-inner row between wrap"><div><div class="eyebrow">See the workspace</div><h2 style="margin-bottom:0">A calm place to make your next move.</h2></div>${button('Open the member concept ↗','demo','')}</div></section></main><footer class="public-footer"><div><div class="brand"><span class="brand-mark">ψ</span>psyalliance</div><p>Illustrative product concept · September 2026</p></div><div class="foot-links"><button class="text-link" style="color:#d6e7dc" data-action="public-how">How it works</button><button class="text-link" style="color:#d6e7dc" data-page="home">Member concept</button></div></footer>`;}
    function home(){return `${header('Thursday, September 24','Good morning, Alex.','A clear view of what needs your attention and who can help.',button('Start a request ↗','request-menu',''))}<div class="split"><section class="card"><div class="card-title"><h3>Your next steps</h3><span class="micro-note">2 to review</span></div><div class="item row"><span class="round-number" style="background:#fbf1e3;color:#865b2b;border-color:#e9d6bd">1</span><div style="flex:1"><strong>October coverage plan has one unresolved need</strong><p>Prescribing coordination · October 12–19 · Last updated yesterday</p></div>${button('Review plan','go-coverage','secondary small-btn')}</div><div class="item row"><span class="round-number">2</span><div style="flex:1"><strong>Maya replied to your coverage conversation</strong><p>New message · Today, 9:14 AM</p></div>${button('Read message','go-messages','secondary small-btn')}</div><div class="item row"><span class="round-number">3</span><div style="flex:1"><strong>Confirm your referral availability</strong><p>Last confirmed 12 days ago · Keep your status useful to colleagues</p></div>${button('Update','go-availability','secondary small-btn')}</div></section><section class="card tint"><div class="card-title"><h3>Your availability</h3><button class="plain-button small" data-page="availability">Manage ↗</button></div><ul class="summary-list"><li><span>Referrals</span><strong>${esc(state.availability.referrals)}</strong></li><li><span>Coverage</span><strong>${esc(state.availability.coverage)}</strong></li><li><span>Consult</span><strong>${esc(state.availability.consult)}</strong></li></ul><div class="micro-note" style="margin-top:17px">Last confirmed September 12 · Reconfirm to keep statuses current</div></section></div><div class="section-heading"><h2>What would you like to do?</h2></div><div class="tile-grid">${[['◇','Find cover','Plan an absence','requests'],['↗','Refer a patient','Find the right colleague','referrals'],['✳','Ask colleagues','Start a consultation','consult'],['◎','Find a clinician','Search your network','network']].map(([s,t,d,p])=>`<button class="task-tile" data-page="${p}"><span class="symbol">${s}</span><b>${t}</b><span>${d} ↗</span></button>`).join('')}</div><div class="section-heading"><h2>From your circle</h2><button class="plain-button small" data-page="network">View Network ↗</button></div><div class="split equal"><section class="card"><div class="card-title"><h3>Relevant requests</h3>${status('1 new','neutral')}</div><div class="item"><div class="row between"><strong>Short-term urgent contact coverage</strong><span class="micro-note">Today</span></div><p>New York · October · Shared by a trusted colleague</p><div style="margin-top:12px">${button('Review request','go-coverage','secondary small-btn')}</div></div></section><section class="card"><div class="card-title"><h3>Your circle</h3><span class="micro-note">Built over time</span></div><p class="small" style="margin-bottom:18px">1 trusted colleague · 1 colleague you have worked with · 2 to discover</p><div class="row">${avatar(clinicians[0])}${avatar(clinicians[1])}${avatar(clinicians[2])}<button class="plain-button small right" data-page="network">Explore ↗</button></div></section></div>`;}
    function requests(){let steps=['Plan','Needs','Candidates','Invite','Track'];let s=state.coverageStep;return `${header('Coverage / plan','Coverage that closes the loop.','A plan tracks every need from definition to a confirmed response.',button('View referrals','go-referrals','secondary'))}<div class="progress" aria-label="Coverage progress">${steps.map((t,i)=>`<span class="progress-step ${s===i?'active':i<s?'done':''}">${i+1}. ${t}</span>`).join('')}</div><div class="split"><div class="stack"><section class="card">${s===0?`<div class="eyebrow">Step 1 · Plan</div><h2>Start with the time away.</h2><p>Use dates and the type of absence to shape the workflow. Add only non-identifying practice needs.</p><div class="fields"><label class="field">Reason for cover<select id="coverage-type"><option>Planned absence</option><option>Extended leave</option><option>Unexpected absence</option></select></label><label class="field">Jurisdiction<select><option>New York</option><option>New Jersey</option></select></label><label class="field">First day<input type="date" value="2026-10-12"></label><label class="field">Return date<input type="date" value="2026-10-19"></label></div><div class="tone-panel" style="margin-top:21px"><b>Private by design</b><p>Leave patient names, dates of birth and clinical details out of this plan. Coordinate protected information through an appropriate clinical channel.</p></div>`:s===1?`<div class="eyebrow">Step 2 · Needs</div><h2>Describe the cover required.</h2><p>Separate distinct needs so a partial response is visible rather than mistaken for a complete plan.</p><div class="quiet-panel"><div class="label-line"><strong style="font-size:13px">Need 01 · Urgent contact</strong>${status('Unresolved','warn')}</div><div class="fields"><label class="field">Support level<select id="coverage-need"><option>Urgent contact only</option><option>Scheduled sessions</option><option>Prescribing coordination</option></select></label><label class="field">Service<select><option>Psychotherapy</option><option>Prescribing</option></select></label></div></div><div class="quiet-panel" style="margin-top:10px"><div class="label-line"><strong style="font-size:13px">Need 02 · Prescribing coordination</strong>${status('Unresolved','warn')}</div><p class="small" style="margin:0">A separately tracked need · New York · October 12–19</p></div>`:s===2?`<div class="eyebrow">Step 3 · Candidates</div><h2>Review the facts before inviting.</h2><p>These reasons explain why colleagues appear here. Check suitability, scope and authority yourself.</p>${clinicians.slice(0,3).map(c=>`<article class="mini-person">${avatar(c)}<div class="content"><h3>${esc(c.name)}</h3><p>${esc(c.role)} · ${esc(c.city)}</p><div class="details"><span>${esc(c.authority)}</span><span>${esc(c.fresh)}</span><span>${esc(c.relation)}</span></div><label class="checkline"><input type="checkbox" data-cover-pick="${c.id}" ${state.coverageSelected.includes(c.id)?'checked':''}>Consider for invitation</label></div></article>`).join('')}<div class="tone-panel">If no colleague is suitable, widen the search or invite a known professional. Unresolved needs remain visible.</div>`:s===3?`<div class="eyebrow">Step 4 · Invitation review</div><h2>Know who receives the request.</h2><p>Recipients see the absence dates, the non-identifying need and a request for a response. Nothing is sent in this design concept.</p><div class="quiet-panel"><strong>Selected colleagues</strong><p class="small" style="margin:7px 0 0">${state.coverageSelected.length?state.coverageSelected.map(id=>clinicians.find(c=>c.id===id)?.name).join(' · '):'No one selected yet — return to Candidates to select a colleague.'}</p></div><div class="quiet-panel" style="margin-top:10px"><strong>Request preview</strong><p class="small" style="margin:7px 0 0">“I am planning a short absence from October 12–19 and am seeking urgent contact cover in New York. Could you review the scope and let me know what you could accept?”</p></div><p class="micro-note" style="margin-top:15px">Sending, delivery and recipient permissions must be implemented in the live product.</p>`:`<div class="eyebrow">Step 5 · Track</div><h2>A request is not a confirmed plan.</h2><p>Keep each need visible until a suitable colleague accepts and you confirm the arrangement.</p><div class="item row between"><div><strong>Urgent contact</strong><p>Maya Chen · illustrative acceptance</p></div>${status('Confirmed')}</div><div class="item row between"><div><strong>Prescribing coordination</strong><p>Awaiting a suitable response</p></div>${status('Unresolved','warn')}</div><div class="tone-panel" style="margin-top:16px"><b>Next step</b><p>Widen outreach for prescribing coordination or arrange a separate fallback. The plan remains in progress.</p></div>`}<div class="row wrap" style="margin-top:24px">${s>0?button('← Previous step','cover-back','secondary'):''}${s<4?button(['Define coverage needs','Review candidates','Review invitations','View plan status'][s]+' →','cover-next',''):button('Return to Home','go-home','secondary')}</div></section></div><aside class="stack"><section class="card tint"><div class="eyebrow">Plan at a glance</div><h3 style="font-family:var(--display);font-size:24px;margin:8px 0">October time away</h3><p class="small">October 12–19 · New York<br>${esc(state.coverageType)}</p><ul class="summary-list"><li><span>Needs</span><strong>2</strong></li><li><span>Recipients considered</span><strong>${state.coverageSelected.length}</strong></li><li><span>Confirmed</span><strong>${s===4?'1':'0'}</strong></li><li><span>Still unresolved</span><strong>${s===4?'1':'2'}</strong></li></ul></section><section class="card"><div class="eyebrow">From the Practice Library</div><h3 style="font-family:var(--display);font-size:21px;margin-top:9px">The coverage agreement</h3><p class="small">PA-01 helps define roles and response expectations with a colleague.</p>${button('View PA-01','open-pa01','secondary small-btn')}</section></aside></div>`;}
    function referrals(){let s=state.referralStep;return `${header('Requests / referrals','A thoughtful route to the right colleague.','Start with the service need. Review a shortlist before sending an invitation.',button('View coverage','go-coverage','secondary'))}<div class="progress">${['Need','Shortlist','Review','Track'].map((x,i)=>`<span class="progress-step ${s===i?'active':i<s?'done':''}">${i+1}. ${x}</span>`).join('')}</div><div class="split"><section class="card">${s===0?`<div class="eyebrow">Step 1 · Define the need</div><h2>Who could be a good fit?</h2><p>Use broad, non-identifying details. Any clinical handoff happens through an appropriate channel after a colleague agrees to consider the referral.</p><div class="fields"><label class="field">Service<select><option>Individual psychotherapy</option><option>Psychiatric evaluation</option><option>Medication management</option></select></label><label class="field">Location<select><option>New York</option><option>New Jersey</option></select></label><label class="field">Focus<select><option>Trauma & anxiety</option><option>Perinatal mental health</option><option>Transitions</option></select></label><label class="field">Modality<select><option>Virtual or in person</option><option>Virtual</option><option>In person</option></select></label></div><div class="tone-panel" style="margin-top:18px">Do not enter names, contact details or other patient-identifying information here.</div>`:s===1?`<div class="eyebrow">Step 2 · Shortlist</div><h2>Consider the relevant facts.</h2><p>Search results explain the match and show when availability was confirmed.</p>${[clinicians[2],clinicians[0]].map(c=>`<article class="mini-person">${avatar(c)}<div class="content"><h3>${esc(c.name)}</h3><p>${esc(c.role)} · ${esc(c.focus)}</p><div class="details"><span>${esc(c.authority)}</span><span>${esc(c.availability)}</span><span>${esc(c.fresh)}</span></div><label class="checkline"><input type="checkbox" data-referral-pick="${c.id}" ${state.referralSelected.includes(c.id)?'checked':''}>Include in recipient review</label></div></article>`).join('')}`:s===2?`<div class="eyebrow">Step 3 · Recipient review</div><h2>Review before you reach out.</h2><p>Choose clinicians deliberately. The message gives only the broad service need.</p><div class="quiet-panel"><strong>Recipients</strong><p class="small" style="margin:8px 0 0">${state.referralSelected.length?state.referralSelected.map(id=>clinicians.find(c=>c.id===id)?.name).join(' · '):'No recipients selected yet'}</p></div><div class="quiet-panel" style="margin-top:11px"><strong>Invitation preview</strong><p class="small" style="margin:8px 0 0">“I am seeking a New York clinician for adult psychotherapy, with experience in trauma and anxiety. Would you be open to discussing fit and next steps?”</p></div><div class="tone-panel" style="margin-top:16px">A colleague's interest does not mean acceptance. Confirm fit and arrange a protected handoff separately.</div>`:`<div class="eyebrow">Step 4 · Outcomes</div><h2>Keep the referral moving.</h2><div class="item row between"><div><strong>Imani Brooks, PhD</strong><p>Interested · follow up about fit</p></div>${status('Interested')}</div><div class="item row between"><div><strong>Maya Chen, PsyD</strong><p>Awaiting response</p></div>${status('Pending','warn')}</div><div class="tone-panel" style="margin-top:16px">Close the request only after you record the outcome. Coordinate any clinical records outside this concept.</div>`}<div class="row wrap" style="margin-top:22px">${s>0?button('← Previous step','ref-back','secondary'):''}${s<3?button(['Review shortlist','Review recipients','See response tracking'][s]+' →','ref-next',''):button('Return to Home','go-home','secondary')}</div></section><aside class="stack"><section class="card tint"><div class="eyebrow">Request summary</div><h3 style="font-family:var(--display);font-size:23px;margin-top:8px">Adult psychotherapy</h3><p class="small">New York · Trauma & anxiety<br>Virtual or in person</p><ul class="summary-list"><li><span>Recipients selected</span><strong>${state.referralSelected.length}</strong></li><li><span>Patient details shared</span><strong>None</strong></li><li><span>Request stage</span><strong>${['Need','Shortlist','Review','Track'][s]}</strong></li></ul></section><section class="card"><div class="eyebrow">Recommended resource</div><h3 style="font-family:var(--display);font-size:21px;margin-top:9px">Referral & transfer toolkit</h3><p class="small">PA-07 provides a framework for referral outcomes and handoff responsibilities.</p>${button('View PA-07','open-pa07','secondary small-btn')}</section></aside></div>`;}
    function clinicianCard(c){let isSaved=state.saved.includes(c.id),isTrusted=state.trusted.includes(c.id),isExcluded=state.excluded.includes(c.id);return `<article class="mini-person" style="margin-bottom:0">${avatar(c)}<div class="content"><div class="row between wrap"><div><h3>${esc(c.name)}</h3><p>${esc(c.role)} · ${esc(c.city)}</p></div>${status(c.availability,c.availability.includes('paused')?'neutral':'')}</div><div class="details"><span>${esc(c.authority)}</span><span>${esc(c.focus)}</span><span>${esc(c.modality)}</span></div><div class="micro-note">${esc(c.fresh)} · ${isTrusted?'Trusted colleague':isExcluded?'Privately excluded':esc(c.relation)}</div><div class="actions"><button class="plain-button small" data-profile="${c.id}">View profile ↗</button><button class="btn secondary small-btn" data-save="${c.id}">${isSaved?'Saved ✓':'Save clinician'}</button>${isTrusted?'<span class="micro-note">Trusted ✓</span>':''}</div></div></article>`;}
    function network(){if(state.selectedProfile)return profileDetail();let tabs=[['directory','Directory'],['trusted','Trusted colleagues'],['saved','Saved'],['worked','Worked with before'],['suggested','Suggested']];let visible=clinicians.filter(c=>!state.blocked.includes(c.id)&&!state.excluded.includes(c.id));if(state.networkTab==='trusted')visible=visible.filter(c=>state.trusted.includes(c.id));if(state.networkTab==='saved')visible=visible.filter(c=>state.saved.includes(c.id));if(state.networkTab==='worked')visible=visible.filter(c=>c.relation==='Worked with before');if(state.networkTab==='suggested')visible=visible.filter(c=>c.relation==='Suggested for you');let q=state.networkQuery.toLowerCase().trim();if(q)visible=visible.filter(c=>[c.name,c.focus,c.role,c.city,c.service,c.languages].join(' ').toLowerCase().includes(q));if(state.networkService!=='All services')visible=visible.filter(c=>c.service===state.networkService);if(state.networkJurisdiction!=='All states')visible=visible.filter(c=>c.authority.includes(state.networkJurisdiction));if(state.networkAvailability)visible=visible.filter(c=>!c.availability.includes('paused'));return `${header('Your professional circle','Find the right colleague.','Search by relevant professional facts, availability and your existing relationships.',button('Invite a colleague','invite-colleague',''))}<div class="split"><div class="stack"><div class="searchbar"><span class="magnify" aria-hidden="true">⌕</span><input id="network-search" type="search" placeholder="Search name, specialty, service or language" aria-label="Search clinicians" value="${esc(state.networkQuery)}"><span class="micro-note">${visible.length} shown</span></div><div class="chip-row"><label class="field" style="min-width:158px">Service<select id="network-service"><option>All services</option><option>Psychotherapy</option><option>Prescribing</option></select></label><label class="field" style="min-width:142px">Jurisdiction<select id="network-state"><option>All states</option><option>New York</option><option>New Jersey</option></select></label><label class="checkline" style="align-self:end;min-height:43px;align-items:center"><input type="checkbox" id="network-availability" ${state.networkAvailability?'checked':''}>Available now</label></div><div class="tabs" role="tablist" aria-label="Network collections">${tabs.map(([id,title])=>`<button role="tab" aria-selected="${state.networkTab===id}" class="tab ${state.networkTab===id?'active':''}" data-network-tab="${id}">${title}</button>`).join('')}</div><div class="stack" id="network-results">${visible.length?visible.map(clinicianCard).join(''):`<div class="empty"><div class="symbol">◎</div><h3>No colleagues in this view yet.</h3><p>Try a broader service or jurisdiction, or invite a known colleague to join your circle.</p>${button('Clear filters','network-reset','secondary')}</div>`}</div><p class="micro-note">Example directory only. Licence evidence and availability are illustrative; this concept does not establish professional suitability.</p></div><aside class="stack"><section class="card tint"><div class="card-title"><h3>Relationship invitations</h3>${status('1 pending','warn')}</div><div class="row" style="align-items:start">${avatar(clinicians[2])}<div><b style="font-size:12px">Imani Brooks, PhD</b><p class="small" style="margin:4px 0 9px">Invited you to connect as a trusted colleague.</p><div class="row wrap">${button('Review','review-invite','secondary small-btn')}</div></div></div></section><section class="card"><div class="eyebrow">How relationships work</div><h3 style="font-family:var(--display);font-size:22px;margin-top:10px">A circle you control.</h3><p class="small"><b>Trusted</b> is a reciprocal relationship. <b>Saved</b> is a private bookmark. <b>Excluded</b> removes a person from your suggestions; <b>Block</b> prevents direct contact.</p><button class="plain-button small" data-action="network-help">See controls ↗</button>${state.excluded.length||state.blocked.length?`<div style="margin-top:12px">${button('Manage hidden clinicians','manage-hidden','secondary small-btn')}</div>`:''}</section><section class="card"><div class="eyebrow">Your circle</div><ul class="summary-list" style="margin-top:13px"><li><span>Trusted</span><strong>${state.trusted.length}</strong></li><li><span>Saved</span><strong>${state.saved.length}</strong></li><li><span>Worked with before</span><strong>1</strong></li></ul></section></aside></div>`;}
    function profileDetail(){let c=clinicians.find(x=>x.id===state.selectedProfile)||clinicians[0];return `<div style="margin-bottom:22px"><button class="plain-button small" data-action="network-back">← All clinicians</button></div><div class="profile-hero">${avatar(c)}<div style="min-width:0"><div class="eyebrow" style="color:#b8d1bb">Clinician profile</div><h2>${esc(c.name)}</h2><p>${esc(c.role)} · ${esc(c.city)}</p><div class="chip-row"><span class="chip">${esc(c.authority)}</span><span class="chip">${esc(c.availability)}</span></div></div><div class="actions">${button(state.saved.includes(c.id)?'Saved ✓':'Save clinician','profile-save','secondary small-btn')}${button('Send message','profile-message','small-btn')}</div></div><div class="split" style="margin-top:18px"><div class="stack"><section class="card"><div class="eyebrow">Professional overview</div><h3 style="font-family:var(--display);font-size:24px;margin-top:12px">Practice at a glance</h3><p>${esc(c.bio)}</p><ul class="summary-list"><li><span>Primary service</span><strong>${esc(c.service)}</strong></li><li><span>Focus</span><strong>${esc(c.focus)}</strong></li><li><span>Modality</span><strong>${esc(c.modality)}</strong></li><li><span>Languages</span><strong>${esc(c.languages)}</strong></li><li><span>Insurance</span><strong>${esc(c.insurance)}</strong></li></ul></section><section class="card"><div class="eyebrow">Professional history</div><div class="item"><strong>${esc(c.relation)}</strong><p>This is a member relationship or suggestion, separate from credential review.</p></div><div class="row wrap">${button(state.trusted.includes(c.id)?'Trusted ✓':'Request trusted connection','profile-trust','secondary small-btn')}${button('Invite to coverage','profile-cover','secondary small-btn')}</div></section></div><aside class="stack"><section class="card tint"><div class="eyebrow">Facts on file</div><h3 style="font-family:var(--display);font-size:23px;margin-top:9px">What is known here</h3><p class="small">${esc(c.fact)}</p><ul class="summary-list"><li><span>Authority recorded</span><strong>${esc(c.authority)}</strong></li><li><span>Availability</span><strong>${esc(c.fresh)}</strong></li></ul><p class="micro-note" style="margin-top:15px">Specific work, jurisdictional authority and fit require independent review.</p></section><section class="card"><div class="eyebrow">Your controls</div><p class="small" style="margin:10px 0 14px">These choices are private to your account in the intended product.</p><div class="stack" style="gap:8px">${button(state.excluded.includes(c.id)?'Remove exclusion':'Exclude from suggestions','profile-exclude','secondary small-btn')}${button(state.blocked.includes(c.id)?'Unblock contact':'Block contact','profile-block','secondary small-btn')}</div></section></aside></div>`;}
    function consult(){if(state.consultDetail)return consultDetail();let t=state.consultTab;return `${header('Consult / professional dialogue','Better questions, better thinking.','Discuss practice questions with a chosen audience. Keep patient information out of the conversation.',button('Ask a question','consult-ask',''))}<div class="split"><div class="stack"><div class="tabs" role="tablist" aria-label="Consult views">${[['discussions','Discussions'],['my','My questions'],['groups','Groups']].map(([id,title])=>`<button role="tab" aria-selected="${t===id}" class="tab ${t===id?'active':''}" data-consult-tab="${id}">${title}</button>`).join('')}</div>${t==='groups'?groupsContent():t==='my'?myConsultContent():`<div class="stack">${state.consultPosts.map(postCard).join('')}</div>`}</div><aside class="stack"><section class="card tint"><div class="eyebrow">Before you post</div><h3 style="font-family:var(--display);font-size:23px;margin-top:10px">Keep it focused and de-identified.</h3><p class="small">Use a short question, relevant context and an intentional audience. Do not include patient names, dates, contact details or a combination of unusual details that could identify someone.</p>${button('Use the question guide','consult-ask','secondary small-btn')}</section><section class="card"><div class="eyebrow">Audience, deliberately chosen</div><ul class="summary-list" style="margin-top:12px"><li><span>Trusted colleagues</span><strong>Your circle</strong></li><li><span>Selected clinicians</span><strong>Named people</strong></li><li><span>Verified network</span><strong>Wider reach</strong></li></ul><p class="micro-note" style="margin-top:14px">Audience access controls are part of the live implementation, not this local illustration.</p></section><section class="card"><div class="eyebrow">Practice Library</div><h3 style="font-family:var(--display);font-size:20px;margin-top:9px">PA-05 · Case consultation</h3><p class="small">A structure for a concise question and a clear record of professional discussion.</p>${button('View resource','open-pa05','secondary small-btn')}</section></aside></div>`;}
    function postCard(post){return `<article class="card"><div class="row between wrap"><span class="eyebrow">${esc(post.tag)} · ${esc(post.audience)}</span>${status(post.status,post.status==='Resolved'?'neutral':'')}</div><h3 style="font-family:var(--display);font-size:24px;margin:12px 0 8px">${esc(post.title)}</h3><p style="font-size:13px">${esc(post.context)}</p><div class="row between wrap" style="border-top:1px solid var(--line);padding-top:14px"><span class="micro-note">${esc(post.author)} · ${esc(post.time)} · ${post.replies} replies</span><button class="plain-button small" data-consult-open="${post.id}">Read discussion ↗</button></div></article>`;}
    function myConsultContent(){let mine=state.consultPosts.filter(p=>p.author==='You');return mine.length?mine.map(postCard).join(''):`<div class="empty"><div class="symbol">✳</div><h3>You have not asked a question yet.</h3><p>Start with a focused question, choose who can see it, then review before posting.</p>${button('Ask a question','consult-ask','')}</div>`;}
    function groupsContent(){return `<div class="group-banner"><div class="eyebrow">Consultation groups</div><h3>Peer Consultation · Thursday Circle</h3><p class="small">6 members · Monthly · Next discussion October 1, 4:00 PM</p><div class="row wrap">${button('Open group space','open-group','')}${button('Read charter','open-pa04','secondary')}</div></div><section class="card"><div class="card-title"><h3>Group principles</h3><span class="micro-note">PA-04 · Charter</span></div><ul class="note-list"><li>Agreed purpose, meeting rhythm and facilitation</li><li>Clear confidentiality and case presentation expectations</li><li>Shared decision about new members and records</li></ul></section><div class="empty"><div class="symbol">◌</div><h3>Start a group with colleagues.</h3><p>Agree an audience and charter first, then open a dedicated group space.</p>${button('Create a group','new-group','secondary')}</div>`;}
    function consultDetail(){let p=state.consultPosts.find(x=>x.id===state.consultDetail);if(!p)return consult();let replies=state.consultReplies[p.id]||[];return `<button class="plain-button small" data-action="consult-back">← All discussions</button><div class="split" style="margin-top:25px"><div class="stack"><article class="card"><div class="row between wrap"><span class="eyebrow">${esc(p.tag)} · ${esc(p.audience)}</span>${status(p.status,p.status==='Resolved'?'neutral':'')}</div><h2 style="margin-top:13px">${esc(p.title)}</h2><p>${esc(p.context)}</p><p class="micro-note">Asked by ${esc(p.author)} · ${esc(p.time)}</p></article><section class="card"><h3 style="font-family:var(--display);font-size:24px">Colleague replies</h3>${replies.map((r,i)=>`<div class="item row" style="align-items:start"><span class="avatar ${i%2?'gold':'blue'}" aria-hidden="true">${i%2?'IB':'MC'}</span><div><b style="font-size:12px">${i%2?'Imani Brooks, PhD':'Maya Chen, PsyD'}</b><p class="small" style="margin-top:4px">${esc(r)}</p></div></div>`).join('')}${p.status==='Open'?`<label class="field" style="margin-top:20px">Add a response<textarea id="consult-reply" placeholder="Share a useful approach without identifiable clinical information"></textarea></label><div class="row wrap" style="margin-top:12px">${button('Post reply','consult-reply','')}${button('Private follow-up','consult-private','secondary')}</div>`:''}</section></div><aside class="stack"><section class="card tint"><div class="eyebrow">Discussion details</div><ul class="summary-list" style="margin-top:13px"><li><span>Audience</span><strong>${esc(p.audience)}</strong></li><li><span>Replies</span><strong>${replies.length}</strong></li><li><span>Status</span><strong>${esc(p.status)}</strong></li></ul>${p.author==='You'&&p.status==='Open'?`<div style="margin-top:17px">${button('Mark resolved','consult-resolve','secondary small-btn')}</div>`:''}</section><section class="card"><div class="eyebrow">Resource</div><h3 style="font-family:var(--display);font-size:20px;margin-top:9px">PA-05 · Consultation template</h3><p class="small">Structure and record the question outside a patient record.</p>${button('View resource','open-pa05','secondary small-btn')}</section></aside></div>`;}
    function messages(){let threads=[['maya','Maya Chen, PsyD','Coverage · October plan'],['eli','Eli Ramirez, MD','Coverage · Prescribing'],['group','Thursday Circle','Consultation group']];let key=state.messageThread,thread=threads.find(t=>t[0]===key)||threads[0];return `${header('Your conversations','Messages with context.','Professional coordination connected to the request or discussion that started it.')}<div class="conversation-layout"><div class="card conversation-list">${threads.map(([id,n,ctx])=>`<button class="conversation-entry ${key===id?'active':''}" data-thread="${id}"><span class="avatar ${id==='eli'?'blue':id==='group'?'lilac':'gold'}">${id==='group'?'TC':id==='eli'?'ER':'MC'}</span><span><b>${n}</b><small>${ctx}</small></span></button>`).join('')}</div><section class="card message-area"><div class="card-title"><div><h3>${thread[1]}</h3><div class="micro-note">${thread[2]}</div></div>${button('View context','message-context','secondary small-btn')}</div><div class="divider" style="margin:0 0 13px"></div>${state.messages[key].map(([sender,text])=>`<div class="bubble ${sender==='You'?'me':''}">${esc(text)}<small>${sender} · illustrative</small></div>`).join('')}<div class="message-compose"><textarea id="message-input" aria-label="Message" placeholder="Write a professional message..."></textarea>${button('Send','message-send','')}</div><p class="micro-note" style="margin:12px 0 0">Local demo only. Do not enter patient-identifying details.</p></section></div>`;}
    function library(){let visible=resources.filter(r=>(state.libraryTab==='curated'||state.libraryTab==='all'?true:state.libraryTab==='mine'?false:r.tag===state.libraryTab)&&[r.id,r.title,r.purpose,r.tag].join(' ').toLowerCase().includes(state.libraryQuery.toLowerCase()));return `${header('Reviewed resources','The Practice Library.','Curated tools placed near the work they support. Review the version and applicability before use.',button('My Library','library-mine','secondary'))}<div class="split"><div class="stack"><div class="searchbar"><span class="magnify">⌕</span><input id="library-search" type="search" placeholder="Search a topic, task or PA number" aria-label="Search library" value="${esc(state.libraryQuery)}"></div><div class="tabs" role="tablist" aria-label="Library categories">${[['curated','Curated Library'],['mine','My Library'],['Coverage','Coverage'],['Consult','Consult'],['Referrals','Referrals'],['Practice','Practice']].map(([id,title])=>`<button role="tab" aria-selected="${state.libraryTab===id}" class="tab ${state.libraryTab===id?'active':''}" data-library-tab="${id}">${title}</button>`).join('')}</div>${state.libraryTab==='mine'?`<div class="empty"><div class="symbol">▧</div><h3>Your working copies live here.</h3><p>Open a reviewed resource and create a private working copy to see it in My Library.</p>${button('Browse curated resources','library-curated','secondary')}</div>`:visible.length?`<div class="resource-grid">${visible.map(r=>`<article class="card resource"><div class="code">${r.id} / ${r.tag}</div><h3>${esc(r.title)}</h3><p>${esc(r.purpose)}</p><div class="foot"><span class="micro-note">${esc(r.version)}</span><button class="plain-button small" data-resource="${r.id}">Explore ↗</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="symbol">▧</div><h3>No resources match that search.</h3><p>Try a task name, subject or PA number.</p>${button('Clear search','library-clear','secondary')}</div>`}</div><aside class="stack"><section class="card tint"><div class="eyebrow">Editorial standard</div><h3 style="font-family:var(--display);font-size:22px;margin-top:10px">A library with context.</h3><p class="small">Each resource presents a version, review date, intended use and a route to the related workflow. A blank export can be completed outside PsyAlliance where appropriate.</p></section><section class="card"><div class="eyebrow">In your workflow</div><h3 style="font-family:var(--display);font-size:21px;margin-top:9px">PA-01 · Reciprocal coverage</h3><p class="small">Explore this from a coverage plan when you need to agree roles with a colleague.</p>${button('Go to coverage','go-coverage','secondary small-btn')}</section></aside></div>`;}
    function availability(){return `${header('Your availability','Keep your signals current.','These member-reported statuses help colleagues understand whether and how to approach you.',button('Reconfirm all statuses','availability-confirm',''))}<div class="split"><section class="card"><div class="eyebrow">What colleagues can see</div><h2 style="margin-top:10px">Choose your capacity.</h2><p>Update each kind of work separately. Pausing one category does not imply the others are closed.</p><div class="stack" style="margin-top:22px"><label class="field">Referrals<select data-availability="referrals"><option>Open to selected referrals</option><option>Open to referrals</option><option>Limited capacity</option><option>Paused</option></select></label><label class="field">Coverage<select data-availability="coverage"><option>Limited capacity</option><option>Open to coverage requests</option><option>Paused</option></select></label><label class="field">Consultation<select data-availability="consult"><option>Open to consult</option><option>Limited capacity</option><option>Paused</option></select></label></div><div class="tone-panel" style="margin-top:22px">Status freshness is displayed to colleagues. Reconfirm a status even when nothing has changed.</div></section><aside class="stack"><section class="card tint"><div class="eyebrow">Last confirmed</div><h3 style="font-family:var(--display);font-size:24px;margin-top:9px">September 12, 2026</h3><p class="small">Your categories remain separate. When stale, the live product should ask you to reconfirm before others rely on a signal.</p></section><section class="card"><div class="eyebrow">At a glance</div><ul class="summary-list" style="margin-top:12px"><li><span>Referrals</span><strong>${esc(state.availability.referrals)}</strong></li><li><span>Coverage</span><strong>${esc(state.availability.coverage)}</strong></li><li><span>Consult</span><strong>${esc(state.availability.consult)}</strong></li></ul></section></aside></div>`;}
    function credentials(){return `${header('Professional account','Facts that earn trust.','A clear record of the evidence behind the professional profile.',button('Add credential','credential-add',''))}<div class="split"><div class="stack"><section class="card"><div class="card-title"><h3>Verification status</h3>${status('Reviewed')}</div><p class="small">Illustrative account: professional identity, degree and a New York licence have review records on file.</p><div class="item row between"><div><b>Professional identity</b><p>Reviewed August 28, 2026</p></div>${status('On file')}</div><div class="item row between"><div><b>Doctoral degree · PsyD</b><p>Reviewed August 28, 2026</p></div>${status('On file')}</div><div class="item row between"><div><b>New York licence</b><p>Renewal date March 2027 · Reviewed August 28, 2026</p></div>${status('On file')}</div></section><section class="card"><h3 style="font-family:var(--display);font-size:23px">What your badge means</h3><p class="small">It reflects specific reviewed professional evidence at a point in time. It does not certify fitness for a particular referral, coverage request or jurisdictional circumstance.</p></section></div><aside class="stack"><section class="card tint"><div class="eyebrow">Renewal planning</div><h3 style="font-family:var(--display);font-size:23px;margin-top:10px">Keep important dates visible.</h3><p class="small">PA-19 connects compliance and renewal reminders to your practice workflow.</p>${button('Explore PA-19','open-pa19','secondary small-btn')}</section><section class="card"><div class="eyebrow">Account states</div><p class="small" style="margin-top:9px">The intended product distinguishes pending review, action required, reviewed, expired and suspended states and explains how each affects participation.</p></section></aside></div>`;}
    function notifications(){return `${header('Activity / notifications','Stay in the loop.','Requests, responses and reminders are tied to the actions in your workspace.')}<div class="split"><section class="card"><div class="item row between"><div><b>Maya replied to your coverage conversation</b><p>Today · 9:14 AM · Open the contextual thread</p></div>${button('Open','go-messages','secondary small-btn')}</div><div class="item row between"><div><b>Coverage plan has an outstanding need</b><p>Yesterday · October time away</p></div>${button('Review','go-coverage','secondary small-btn')}</div><div class="item row between"><div><b>Reconfirm referral availability</b><p>September 22 · Last confirmed 12 days ago</p></div>${button('Update','go-availability','secondary small-btn')}</div></section><aside class="card tint"><div class="eyebrow">Beyond the workspace</div><h3 style="font-family:var(--display);font-size:23px;margin-top:10px">Useful when you are away.</h3><p class="small">The intended product delivers configurable in-app and email notifications, a weekly digest and direct links back to the relevant work.</p></aside></div>`;}
    function ownProfile(){return `${header('Your account','A clear professional profile.','The information colleagues can use to understand your practice.',button('Edit profile','profile-edit',''))}<div class="split"><section class="card"><div class="row" style="align-items:start"><span class="avatar" style="width:62px;height:62px;flex-basis:62px;font-size:24px">AR</span><div><h2 style="font-size:29px;margin:0">Alex Rivers, PsyD</h2><p>Clinical psychologist · New York, NY</p>${status('Professional evidence reviewed')}</div></div><div class="divider"></div><ul class="summary-list"><li><span>Practice focus</span><strong>Adult psychotherapy</strong></li><li><span>Modality</span><strong>Virtual & in person</strong></li><li><span>Jurisdiction</span><strong>New York</strong></li><li><span>Member since</span><strong>August 2026</strong></li></ul></section><aside class="stack"><section class="card tint"><div class="eyebrow">Founding member</div><h3 style="font-family:var(--display);font-size:23px;margin-top:10px">Help shape the circle.</h3><p class="small">An illustrative membership distinction. Product access and pricing would need their own clear policy in the live service.</p></section><section class="card"><h3 style="font-family:var(--display);font-size:22px">Manage your account</h3><div class="stack" style="gap:10px;margin-top:16px">${button('Credentials','go-credentials','secondary small-btn')}${button('Availability','go-availability','secondary small-btn')}</div></section></aside></div>`;}
    const screens={home,requests,referrals,network,consult,messages,library,availability,credentials,notifications,profile:ownProfile};
    function render(){document.getElementById('root').innerHTML=state.page==='public'?publicPage():memberShell();document.getElementById('concept-switch').textContent=state.page==='public'?'Open member concept':'View public page';document.getElementById('modal-root').innerHTML=state.modal?modalContent():''; if(state.page==='network'){let a=document.getElementById('network-service'),b=document.getElementById('network-state');if(a)a.value=state.networkService;if(b)b.value=state.networkJurisdiction;}if(state.page==='availability'){document.querySelectorAll('[data-availability]').forEach(x=>x.value=state.availability[x.dataset.availability]);}if(state.modal==='consult-compose'&&!state.consultReview){document.getElementById('consult-audience').value=state.consultAudience;document.getElementById('consult-tag').value=state.consultTag;}}
    function modalContent(){let key=state.modal;let title='',body='',actions='';if(key==='consult-compose'){title=state.consultReview?'Review your question':'Ask colleagues a question';body=state.consultReview?`<div class="eyebrow">Before publishing</div><h3 style="font-family:var(--display);font-size:23px;margin-top:11px">${esc(state.consultQuestion)}</h3><p class="small">${esc(state.consultContext)||'No extra context'}</p><div class="quiet-panel"><b>Audience</b><p class="small" style="margin:5px 0">${esc(state.consultAudience)}${state.consultAudience==='Selected clinicians'?' · '+state.consultRecipients.map(id=>clinicians.find(c=>c.id===id)?.name).join(', '):''}</p><b>Tag</b><p class="small" style="margin:5px 0 0">${esc(state.consultTag)}</p></div><label class="checkline" style="margin-top:17px"><input type="checkbox" id="consult-confirm">I reviewed this for patient-identifying information and understand the selected audience.</label><p class="micro-note" style="margin-top:11px">This concept creates a local sample discussion only; it does not publish to a network.</p>`:`<div class="stack"><label class="field">Your focused question<input id="consult-question" maxlength="180" placeholder="What would you like colleagues to help think through?" value="${esc(state.consultQuestion)}"><small>Ask a question that can be discussed without identifying an individual.</small></label><label class="field">Helpful context<textarea id="consult-context" placeholder="Add only the general context necessary for colleagues to respond">${esc(state.consultContext)}</textarea></label><div class="fields"><label class="field">Audience<select id="consult-audience"><option>Trusted colleagues</option><option>Selected clinicians</option><option>Verified network</option></select></label><label class="field">Topic<select id="consult-tag"><option>Clinical practice</option><option>Coverage</option><option>Professional practice</option><option>Group practice</option></select></label></div>${state.consultAudience==='Selected clinicians'?`<fieldset style="border:1px solid var(--line);border-radius:7px;padding:13px"><legend class="small" style="font-weight:650">Choose recipients</legend>${[clinicians[0],clinicians[2]].map(c=>`<label class="checkline" style="margin:7px 0"><input type="checkbox" data-consult-recipient="${c.id}" ${state.consultRecipients.includes(c.id)?'checked':''}>${esc(c.name)} · ${esc(c.role)}</label>`).join('')}</fieldset>`:''}<div class="tone-panel"><b>De-identification check</b><p>Remove names, dates, locations or rare combinations of facts that could point to a patient. A checkbox cannot guarantee de-identification.</p></div></div>`;actions=state.consultReview?`${button('← Edit question','consult-edit','secondary')}${button('Create sample discussion','consult-publish','')}`:`${button('Cancel','modal-close','secondary')}${button('Review audience & question','consult-review','')}`;}
      else if(key==='invite-colleague'){title='Invite a trusted colleague';body=`<p>Start with a professional invitation. The live product would preserve this invitation if the recipient registers later.</p><label class="field">Colleague email<input id="invite-email" type="email" required placeholder="colleague@example.org" value="${esc(state.inviteEmail||'')}"></label><p class="micro-note" style="margin-top:12px">This concept never sends an email.</p>`;actions=`${button('Cancel','modal-close','secondary')}${button('Preview invitation','invite-preview','')}`;}
      else if(key==='invite-preview'){title='Review invitation';body=`<p>Your colleague would receive an invitation to connect on PsyAlliance. This local concept stores no invitation and sends no email.</p><div class="quiet-panel"><b>Recipient</b><p class="small" style="margin:5px 0">${esc(state.inviteEmail||'colleague@example.org')}</p><b>Relationship</b><p class="small" style="margin:5px 0 0">Trusted colleague request</p></div>`;actions=`${button('Back','invite-back','secondary')}${button('Finish preview','invite-finish','')}`;}
      else if(key==='review-invite'){title='A colleague wants to connect';body=`<div class="row">${avatar(clinicians[2])}<div><b>Imani Brooks, PhD</b><p class="small" style="margin:2px 0">Clinical psychologist · New York</p></div></div><p style="margin-top:18px">Trusted colleague status is reciprocal. Review the professional profile and decide whether to add this person to your circle.</p>`;actions=`${button('Decline sample','invite-decline','secondary')}${button('Accept sample','invite-accept','')}`;}
      else if(key==='network-help'){title='Your Network controls';body=`<div class="stack"><div><b>Trusted colleagues</b><p class="small">A mutual, accepted connection.</p></div><div><b>Saved clinicians</b><p class="small">A private bookmark for later.</p></div><div><b>Exclude</b><p class="small">A private preference that removes a clinician from your suggested matches.</p></div><div><b>Block</b><p class="small">Prevents direct contact in the intended product. This mockup only hides the sample profile.</p></div></div>`;actions=button('Close','modal-close','secondary');}
      else if(key==='manage-hidden'){title='Hidden clinicians';body=`<p>Review and reverse your private exclusions and contact blocks in this local concept.</p>${[...new Set([...state.excluded,...state.blocked])].map(id=>{let c=clinicians.find(x=>x.id===id);return `<div class="item row between wrap"><div><b>${esc(c.name)}</b><p>${state.blocked.includes(id)?'Contact blocked':'Excluded from suggestions'}</p></div>${button('Restore','restore-'+id,'secondary small-btn')}</div>`}).join('')}`;actions=button('Done','modal-close','secondary');}
      else if(key==='group'){title='Thursday Circle · Group space';body=`<div class="group-banner"><div class="eyebrow">Peer consultation group</div><h3>Next meeting · October 1</h3><p class="small" style="margin:0">Discuss agenda, resources and group process without patient-identifying details.</p></div><div class="item"><b>Latest note · Imani Brooks</b><p>“I added two prompts for the next discussion.”</p></div><div class="item"><b>Group charter · PA-04</b><p>Purpose, membership, confidentiality and meeting rhythm.</p></div>`;actions=`${button('Go to group messages','group-messages','secondary')}${button('View PA-04','open-pa04','')}`;}
      else if(key==='new-group'){title='Create a consultation group';body=`<label class="field">Group name<input id="group-name" placeholder="e.g. Thursday peer consultation"></label><p class="small" style="margin-top:15px">A live group setup would require a participant list, a reviewed PA-04 charter and explicit acceptance before the space opens.</p>`;actions=`${button('Cancel','modal-close','secondary')}${button('Preview group','new-group-preview','')}`;}
      else if(key==='resource'){let r=resources.find(x=>x.id===state.resourceId)||resources[0];title=`${r.id} · ${r.title}`;body=`<div class="eyebrow">Curated resource / ${esc(r.tag)}</div><h3 style="font-family:var(--display);font-size:23px;margin-top:11px">What it is for</h3><p>${esc(r.purpose)}</p><div class="quiet-panel"><b>Editorial details</b><p class="small" style="margin:7px 0 0">${esc(r.version)} · Illustrative metadata. A live resource must expose its reviewer, source, applicability and version history.</p></div><p class="small" style="margin:16px 0 0">Use the related workflow to put this resource in context. A blank working copy or export belongs to the live Library experience.</p>`;actions=`${button('Close','modal-close','secondary')}${button('Open related workflow','resource-workflow','')}`;}
      else if(key==='credential'){title='Add professional evidence';body=`<p>In the live product, this flow would collect evidence privately, submit it to a review queue and clearly mark the account pending until reviewed.</p><div class="fields"><label class="field">Credential type<select><option>State licence</option><option>Degree</option><option>Interstate authority</option></select></label><label class="field">Jurisdiction<input placeholder="State, if applicable"></label></div><p class="micro-note" style="margin-top:14px">No file or professional information is stored by this concept.</p>`;actions=button('Close','modal-close','secondary');}
      else if(key==='request-menu'){title='What do you need?';body=`<div class="stack"><button class="task-tile" style="min-height:95px" data-page="requests"><span class="symbol">◇</span><b>Find coverage</b><span>Plan an absence and track confirmation ↗</span></button><button class="task-tile" style="min-height:95px" data-page="referrals"><span class="symbol">↗</span><b>Make a referral</b><span>Find a colleague and follow the outcome ↗</span></button></div>`;actions=button('Close','modal-close','secondary');}
      else if(key==='edit-profile'){title='Edit professional profile';body=`<div class="fields"><label class="field">Display name<input value="Alex Rivers, PsyD"></label><label class="field">Primary service<input value="Adult psychotherapy"></label><label class="field full">Professional summary<textarea>Clinical psychologist in New York.</textarea></label></div><p class="micro-note" style="margin-top:12px">This concept does not store changes.</p>`;actions=`${button('Cancel','modal-close','secondary')}${button('Preview changes','profile-preview','')}`;}
      else if(key==='mobile-menu'){title='Explore the workspace';body=`<div class="rail-nav">${Object.keys(names).map(p=>railLink(p)).join('')}</div>`;actions=button('Close','modal-close','secondary');}
      return `<div class="modal-backdrop" data-overlay="1"><div class="modal ${key==='consult-compose'?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><div><div class="eyebrow">PsyAlliance · Illustrative action</div><h2 id="dialog-title">${title}</h2></div><button type="button" data-action="modal-close" aria-label="Close dialog">×</button></div>${body}<div class="modal-actions">${actions}</div></div></div>`;}
    function openResource(id){state.resourceId=id;state.modal='resource';render();}
    document.addEventListener('click',e=>{
      if(e.target.id==='concept-switch'){nav(state.page==='public'?'home':'public');return;}
      if(e.target.dataset.overlay){state.modal=null;render();return;}
      let el=e.target.closest('[data-page],[data-network-tab],[data-consult-tab],[data-consult-open],[data-library-tab],[data-profile],[data-save],[data-thread],[data-resource],[data-action]');if(!el)return;
      if(el.dataset.page){nav(el.dataset.page);return;}
      if(el.dataset.networkTab){state.networkTab=el.dataset.networkTab;render();return;}
      if(el.dataset.consultTab){state.consultTab=el.dataset.consultTab;render();return;}
      if(el.dataset.consultOpen){state.consultDetail=el.dataset.consultOpen;render();window.scrollTo(0,0);return;}
      if(el.dataset.libraryTab){state.libraryTab=el.dataset.libraryTab;render();return;}
      if(el.dataset.profile){state.selectedProfile=el.dataset.profile;render();window.scrollTo(0,0);return;}
      if(el.dataset.save){let id=el.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();toast(state.saved.includes(id)?'Clinician saved privately.':'Removed from Saved.');return;}
      if(el.dataset.thread){state.messageThread=el.dataset.thread;render();return;}
      if(el.dataset.resource){openResource(el.dataset.resource);return;}
      let a=el.dataset.action;
      if(a.startsWith('go-')){nav(({coverage:'requests',referrals:'referrals',messages:'messages',availability:'availability',home:'home',credentials:'credentials'})[a.slice(3)]||'home');return;}
      if(a.startsWith('restore-')){let id=a.slice(8);state.excluded=state.excluded.filter(x=>x!==id);state.blocked=state.blocked.filter(x=>x!==id);render();toast('Clinician restored in this local concept.');return;}
      if(a.startsWith('open-pa')){openResource('PA-'+a.slice(7).toUpperCase().padStart(2,'0'));return;}
      switch(a){
        case 'demo':nav('home');break;
        case 'public-how':document.getElementById('how-it-works')?.scrollIntoView();break;
        case 'public-trust':document.getElementById('our-approach')?.scrollIntoView();break;
        case 'request-menu':case 'invite-colleague':case 'review-invite':case 'network-help':case 'manage-hidden':case 'new-group':case 'mobile-menu':state.modal=a;render();break;
        case 'modal-close':state.modal=null;state.consultReview=false;render();break;
        case 'network-back':state.selectedProfile=null;render();break;
        case 'network-reset':state.networkQuery='';state.networkService='All services';state.networkJurisdiction='All states';state.networkAvailability=false;render();break;
        case 'profile-save':{let id=state.selectedProfile;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();toast(state.saved.includes(id)?'Clinician saved privately.':'Removed from Saved.');break;}
        case 'profile-trust':{let id=state.selectedProfile;if(state.trusted.includes(id)){toast('This colleague is already trusted.');break;}state.trusted.push(id);render();toast('Illustrative trusted connection accepted locally.');break;}
        case 'profile-exclude':{let id=state.selectedProfile;state.excluded=state.excluded.includes(id)?state.excluded.filter(x=>x!==id):[...state.excluded,id];render();toast(state.excluded.includes(id)?'Clinician excluded privately from suggestions.':'Exclusion removed.');break;}
        case 'profile-block':{let id=state.selectedProfile;state.blocked=state.blocked.includes(id)?state.blocked.filter(x=>x!==id):[...state.blocked,id];render();toast(state.blocked.includes(id)?'Contact blocked in this sample view.':'Block removed.');break;}
        case 'profile-cover':nav('requests');state.coverageStep=2;render();break;
        case 'profile-message':nav('messages');break;
        case 'cover-back':state.coverageStep=Math.max(0,state.coverageStep-1);render();break;
        case 'cover-next':if(state.coverageStep===2&&!state.coverageSelected.length){toast('Select at least one colleague to review.');break;}state.coverageStep=Math.min(4,state.coverageStep+1);render();break;
        case 'ref-back':state.referralStep=Math.max(0,state.referralStep-1);render();break;
        case 'ref-next':if(state.referralStep===1&&!state.referralSelected.length){toast('Select at least one clinician to review.');break;}state.referralStep=Math.min(3,state.referralStep+1);render();break;
        case 'invite-preview':{let inp=document.getElementById('invite-email');if(!inp?.checkValidity()||!inp.value.trim()){inp?.reportValidity();break;}state.inviteEmail=inp.value;state.modal='invite-preview';render();break;}
        case 'invite-back':state.modal='invite-colleague';render();break;
        case 'invite-finish':state.modal=null;render();toast('Invitation preview complete. No email was sent.');break;
        case 'invite-accept':state.trusted=[...new Set([...state.trusted,'imani'])];state.modal=null;render();toast('Imani added to Trusted in this local concept.');break;
        case 'invite-decline':state.modal=null;render();toast('Invitation dismissed in this local concept.');break;
        case 'consult-ask':state.consultReview=false;state.modal='consult-compose';render();break;
        case 'consult-review':{let q=document.getElementById('consult-question')?.value.trim();if(!q){document.getElementById('consult-question')?.focus();toast('Add a focused question before review.');break;}state.consultQuestion=q;state.consultContext=document.getElementById('consult-context')?.value.trim()||'';state.consultAudience=document.getElementById('consult-audience')?.value||'Trusted colleagues';state.consultTag=document.getElementById('consult-tag')?.value||'Clinical practice';if(state.consultAudience==='Selected clinicians'&&!state.consultRecipients.length){toast('Choose at least one clinician for this audience.');break;}state.consultReview=true;render();break;}
        case 'consult-edit':state.consultReview=false;render();break;
        case 'consult-publish':{if(!document.getElementById('consult-confirm')?.checked){toast('Review and confirm the de-identification guidance.');break;}let p={id:'c'+Date.now(),title:state.consultQuestion,context:state.consultContext,tag:state.consultTag,audience:state.consultAudience,time:'Just now',replies:0,author:'You',status:'Open'};state.consultPosts.unshift(p);state.consultReplies[p.id]=[];state.consultQuestion='';state.consultContext='';state.consultRecipients=[];state.consultReview=false;state.modal=null;state.consultTab='my';state.consultDetail=p.id;render();toast('Sample discussion created locally. Nothing was published.');break;}
        case 'consult-back':state.consultDetail=null;render();break;
        case 'consult-reply':{let val=document.getElementById('consult-reply')?.value.trim();if(!val){toast('Write a reply first.');break;}state.consultReplies[state.consultDetail].push(val);state.consultPosts.find(x=>x.id===state.consultDetail).replies++;render();toast('Reply added to this local concept.');break;}
        case 'consult-resolve':state.consultPosts.find(x=>x.id===state.consultDetail).status='Resolved';render();toast('Sample discussion marked resolved.');break;
        case 'consult-private':nav('messages');toast('Continue in a contextual private conversation.');break;
        case 'open-group':state.modal='group';render();break;
        case 'group-messages':state.modal=null;nav('messages');state.messageThread='group';render();break;
        case 'new-group-preview':{let x=document.getElementById('group-name');if(!x?.value.trim()){x?.focus();toast('Name the group first.');break;}state.modal=null;render();toast('Group preview complete. No group was created.');break;}
        case 'message-send':{let x=document.getElementById('message-input');if(!x?.value.trim()){x?.focus();break;}state.messages[state.messageThread].push(['You',x.value.trim()]);render();toast('Message added to this local sample only.');break;}
        case 'message-context':nav(state.messageThread==='group'?'consult':'requests');break;
        case 'library-mine':state.libraryTab='mine';render();break;
        case 'library-curated':state.libraryTab='curated';render();break;
        case 'library-clear':state.libraryQuery='';render();break;
        case 'resource-workflow':{let target=(resources.find(r=>r.id===state.resourceId)||resources[0]).link;state.modal=null;nav(target);break;}
        case 'availability-confirm':render();toast('Statuses reconfirmed in this local concept.');break;
        case 'credential-add':state.modal='credential';render();break;
        case 'profile-edit':state.modal='edit-profile';render();break;
        case 'profile-preview':state.modal=null;render();toast('Profile preview complete. No account changes were stored.');break;
      }
    });
    document.addEventListener('input',e=>{let id=e.target.id;if(id==='network-search'){state.networkQuery=e.target.value;let pos=e.target.selectionStart;render();let x=document.getElementById(id);x?.focus();x?.setSelectionRange(pos,pos);}if(id==='library-search'){state.libraryQuery=e.target.value;let pos=e.target.selectionStart;render();let x=document.getElementById(id);x?.focus();x?.setSelectionRange(pos,pos);}});
    document.addEventListener('change',e=>{let id=e.target.id;if(id==='network-service'){state.networkService=e.target.value;render();}if(id==='network-state'){state.networkJurisdiction=e.target.value;render();}if(id==='network-availability'){state.networkAvailability=e.target.checked;render();}if(id==='coverage-type')state.coverageType=e.target.value;if(id==='coverage-need')state.coverageNeed=e.target.value;if(e.target.dataset.coverPick){let x=e.target.dataset.coverPick;state.coverageSelected=e.target.checked?[...new Set([...state.coverageSelected,x])]:state.coverageSelected.filter(y=>y!==x);render();}if(e.target.dataset.referralPick){let x=e.target.dataset.referralPick;state.referralSelected=e.target.checked?[...new Set([...state.referralSelected,x])]:state.referralSelected.filter(y=>y!==x);render();}if(e.target.id==='consult-audience'){state.consultQuestion=document.getElementById('consult-question')?.value||'';state.consultContext=document.getElementById('consult-context')?.value||'';state.consultTag=document.getElementById('consult-tag')?.value||'Clinical practice';state.consultAudience=e.target.value;render();}if(e.target.dataset.consultRecipient){let id=e.target.dataset.consultRecipient;state.consultRecipients=e.target.checked?[...new Set([...state.consultRecipients,id])]:state.consultRecipients.filter(x=>x!==id);}if(e.target.dataset.availability){state.availability[e.target.dataset.availability]=e.target.value;render();toast('Sample availability updated locally.');}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;state.consultReview=false;render();}});
    render();
  </script>
</body>
</html>
